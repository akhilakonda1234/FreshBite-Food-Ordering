<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FreshBite - Register</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #fff4e6, #ffe0b2);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px 15px;
        }

        .register-card {
            width: 100%;
            max-width: 520px;
            background: white;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.15);
        }

        .logo {
            text-align: center;
            font-size: 32px;
            font-weight: bold;
            color: #ff6b00;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 28px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 7px;
            color: #333;
        }

        input,
        textarea {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid #ddd;
            border-radius: 9px;
            font-size: 15px;
            outline: none;
            transition: 0.2s;
        }

        input:focus,
        textarea:focus {
            border-color: #ff6b00;
            box-shadow: 0 0 0 3px rgba(255, 107, 0, 0.1);
        }

        textarea {
            resize: vertical;
            min-height: 85px;
        }

        /* =========================
           PHONE FIELD
        ========================= */

        .phone-field {
            position: relative;
            display: flex;
            width: 100%;
        }

        .country-code-btn {
            width: 78px;
            min-width: 78px;
            border: 1px solid #ddd;
            border-right: none;
            border-radius: 9px 0 0 9px;
            background: #fff;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            color: #333;
        }

        .country-code-btn:hover {
            background: #fff7f0;
        }

        #phone {
            border-radius: 0 9px 9px 0;
        }

        .country-code-arrow {
            font-size: 10px;
            margin-left: 4px;
        }

        .country-dropdown {
            display: none;
            position: absolute;
            top: calc(100% + 6px);
            left: 0;
            width: 300px;
            background: white;
            border: 1px solid #ddd;
            border-radius: 10px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
            z-index: 1000;
            overflow: hidden;
        }

        .country-dropdown.active {
            display: block;
        }

        .country-search {
            padding: 10px;
            border-bottom: 1px solid #eee;
        }

        .country-search input {
            padding: 10px;
        }

        .country-list {
            max-height: 250px;
            overflow-y: auto;
        }

        .country-option {
            padding: 11px 13px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
        }

        .country-option:hover {
            background: #fff3e8;
        }

        .country-name {
            color: #333;
        }

        .country-code {
            font-weight: bold;
            color: #ff6b00;
        }

        .phone-hint {
            font-size: 12px;
            color: #888;
            margin-top: 5px;
        }

        /* =========================
           ADDRESS
        ========================= */

        .address-title {
            margin-top: 5px;
            margin-bottom: 12px;
            color: #ff6b00;
            font-size: 18px;
        }

        .address-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .pin-status {
            font-size: 12px;
            margin-top: 5px;
            min-height: 16px;
        }

        .pin-status.success {
            color: #16803c;
        }

        .pin-status.error {
            color: #d93025;
        }

        .pin-status.loading {
            color: #777;
        }

        .location-note {
            background: #fff7ef;
            border: 1px solid #ffe0c2;
            color: #777;
            font-size: 12px;
            padding: 9px 11px;
            border-radius: 8px;
            margin-top: 8px;
        }

        button.create-account {
            width: 100%;
            border: none;
            padding: 14px;
            border-radius: 10px;
            background: #ff6b00;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 8px;
            transition: 0.2s;
        }

        button.create-account:hover {
            background: #e85d00;
            transform: translateY(-1px);
        }

        .login-link {
            text-align: center;
            margin-top: 18px;
            color: #777;
            font-size: 14px;
        }

        .login-link a {
            color: #ff6b00;
            text-decoration: none;
            font-weight: bold;
        }

        .message {
            margin-top: 15px;
            text-align: center;
            font-size: 14px;
            min-height: 20px;
        }

        @media (max-width: 600px) {
            .register-card {
                padding: 25px 20px;
            }

            .address-row {
                grid-template-columns: 1fr;
                gap: 0;
            }

            .country-dropdown {
                width: 280px;
            }
        }
    </style>
</head>

<body>

<div class="register-card">

    <div class="logo">🍔 FreshBite</div>
    <div class="subtitle">Create your account</div>

    <form id="register-form">

        <!-- FULL NAME -->
        <div class="form-group">
            <label for="name">Full Name</label>
            <input
                type="text"
                id="name"
                placeholder="Enter your full name"
                required
            >
        </div>

        <!-- EMAIL -->
        <div class="form-group">
            <label for="email">Email Address</label>
            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                required
            >
        </div>

        <!-- PASSWORD -->
        <div class="form-group">
            <label for="password">Password</label>
            <input
                type="password"
                id="password"
                placeholder="Create a password"
                required
                minlength="6"
            >
        </div>

        <!-- PHONE -->
        <div class="form-group">
            <label for="phone">Phone Number</label>

            <div class="phone-field">

                <button
                    type="button"
                    class="country-code-btn"
                    id="country-code-btn"
                >
                    <span id="selected-code">+91</span>
                    <span class="country-code-arrow">▼</span>
                </button>

                <input
                    type="tel"
                    id="phone"
                    placeholder="Enter phone number"
                    autocomplete="tel"
                    inputmode="numeric"
                    required
                >

                <div
                    class="country-dropdown"
                    id="country-dropdown"
                >
                    <div class="country-search">
                        <input
                            type="text"
                            id="country-search"
                            placeholder="Search country or code..."
                            autocomplete="off"
                        >
                    </div>

                    <div
                        class="country-list"
                        id="country-list"
                    ></div>
                </div>

            </div>

            <div class="phone-hint">
                Select your region code and enter your phone number.
            </div>
        </div>

        <!-- ADDRESS -->
        <div class="form-group">

            <div class="address-title">
                📍 Delivery Address
            </div>

            <!-- HOUSE / STREET -->
            <label for="address">
                House / Flat / Street Address
            </label>

            <textarea
                id="address"
                placeholder="Enter house number, flat number, street or area"
                required
            ></textarea>

            <!-- PIN + CITY -->
            <div class="address-row">

                <div class="form-group">
                    <label for="pincode">PIN Code</label>

                    <input
                        type="text"
                        id="pincode"
                        placeholder="Enter 6-digit PIN"
                        maxlength="6"
                        inputmode="numeric"
                        autocomplete="postal-code"
                        required
                    >

                    <div
                        id="pin-status"
                        class="pin-status"
                    ></div>
                </div>

                <div class="form-group">
                    <label for="city">City</label>

                    <input
                        type="text"
                        id="city"
                        placeholder="Auto-filled from PIN"
                        readonly
                        required
                    >
                </div>

            </div>

            <!-- STATE + COUNTRY -->
            <div class="address-row">

                <div class="form-group">
                    <label for="state">State</label>

                    <input
                        type="text"
                        id="state"
                        placeholder="Auto-filled from PIN"
                        readonly
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="country">Country</label>

                    <input
                        type="text"
                        id="country"
                        value="India"
                        readonly
                    >
                </div>

            </div>

            <div class="location-note">
                💡 Enter your 6-digit Indian PIN code. City and State
                will be automatically detected.
            </div>

        </div>

        <!-- CREATE ACCOUNT -->
        <button
            type="submit"
            class="create-account"
        >
            Create Account
        </button>

        <div
            class="message"
            id="message"
        ></div>

    </form>

    <div class="login-link">
        Already have an account?
        <a href="login.html">Login</a>
    </div>

</div>


<script>
    /* =====================================================
       INTERNATIONAL COUNTRY CODES
    ===================================================== */

    const countries = [
        { name: "India", code: "+91" },
        { name: "United States", code: "+1" },
        { name: "United Kingdom", code: "+44" },
        { name: "Canada", code: "+1" },
        { name: "Australia", code: "+61" },
        { name: "New Zealand", code: "+64" },
        { name: "United Arab Emirates", code: "+971" },
        { name: "Saudi Arabia", code: "+966" },
        { name: "Qatar", code: "+974" },
        { name: "Kuwait", code: "+965" },
        { name: "Bahrain", code: "+973" },
        { name: "Oman", code: "+968" },
        { name: "Singapore", code: "+65" },
        { name: "Malaysia", code: "+60" },
        { name: "Thailand", code: "+66" },
        { name: "Indonesia", code: "+62" },
        { name: "Philippines", code: "+63" },
        { name: "Vietnam", code: "+84" },
        { name: "Japan", code: "+81" },
        { name: "South Korea", code: "+82" },
        { name: "China", code: "+86" },
        { name: "Hong Kong", code: "+852" },
        { name: "Taiwan", code: "+886" },
        { name: "Germany", code: "+49" },
        { name: "France", code: "+33" },
        { name: "Italy", code: "+39" },
        { name: "Spain", code: "+34" },
        { name: "Portugal", code: "+351" },
        { name: "Netherlands", code: "+31" },
        { name: "Belgium", code: "+32" },
        { name: "Switzerland", code: "+41" },
        { name: "Austria", code: "+43" },
        { name: "Sweden", code: "+46" },
        { name: "Norway", code: "+47" },
        { name: "Denmark", code: "+45" },
        { name: "Finland", code: "+358" },
        { name: "Ireland", code: "+353" },
        { name: "Poland", code: "+48" },
        { name: "Greece", code: "+30" },
        { name: "Russia", code: "+7" },
        { name: "Ukraine", code: "+380" },
        { name: "Turkey", code: "+90" },
        { name: "Brazil", code: "+55" },
        { name: "Mexico", code: "+52" },
        { name: "Argentina", code: "+54" },
        { name: "Chile", code: "+56" },
        { name: "Colombia", code: "+57" },
        { name: "South Africa", code: "+27" },
        { name: "Egypt", code: "+20" },
        { name: "Nigeria", code: "+234" },
        { name: "Kenya", code: "+254" },
        { name: "Ghana", code: "+233" },
        { name: "Nepal", code: "+977" },
        { name: "Sri Lanka", code: "+94" },
        { name: "Bangladesh", code: "+880" },
        { name: "Pakistan", code: "+92" },
        { name: "Afghanistan", code: "+93" }
    ];

    let selectedCountryCode = "+91";


    /* =====================================================
       COUNTRY DROPDOWN
    ===================================================== */

    const countryCodeButton =
        document.getElementById("country-code-btn");

    const countryDropdown =
        document.getElementById("country-dropdown");

    const countrySearch =
        document.getElementById("country-search");

    const countryList =
        document.getElementById("country-list");

    const selectedCode =
        document.getElementById("selected-code");


    function displayCountries(searchText = "") {

        const search = searchText.toLowerCase().trim();

        const filteredCountries = countries.filter(country =>
            country.name.toLowerCase().includes(search) ||
            country.code.includes(search)
        );

        countryList.innerHTML = "";

        if (filteredCountries.length === 0) {
            countryList.innerHTML =
                '<div style="padding:15px;text-align:center;color:#777;">No country found</div>';
            return;
        }

        filteredCountries.forEach(country => {

            const option = document.createElement("div");

            option.className = "country-option";

            option.innerHTML = `
                <span class="country-name">
                    ${country.name}
                </span>

                <span class="country-code">
                    ${country.code}
                </span>
            `;

            option.addEventListener("click", function () {

                selectedCountryCode = country.code;

                selectedCode.textContent =
                    country.code;

                countryDropdown.classList.remove("active");

                countrySearch.value = "";

                displayCountries();

                document.getElementById("phone").focus();
            });

            countryList.appendChild(option);
        });
    }


    countryCodeButton.addEventListener("click", function () {

        countryDropdown.classList.toggle("active");

        if (countryDropdown.classList.contains("active")) {
            countrySearch.focus();
        }
    });


    countrySearch.addEventListener("input", function () {
        displayCountries(this.value);
    });


    document.addEventListener("click", function (event) {

        if (
            !event.target.closest(".phone-field")
        ) {
            countryDropdown.classList.remove("active");
        }

    });


    displayCountries();


    /* =====================================================
       PHONE NUMBER
    ===================================================== */

    document
        .getElementById("phone")
        .addEventListener("input", function () {

            this.value = this.value.replace(/\D/g, "");

        });


    /* =====================================================
       PIN CODE → CITY + STATE
       INDIA POSTAL PIN LOOKUP
    ===================================================== */

    const pincodeInput =
        document.getElementById("pincode");

    const cityInput =
        document.getElementById("city");

    const stateInput =
        document.getElementById("state");

    const pinStatus =
        document.getElementById("pin-status");


    let pinTimer;


    pincodeInput.addEventListener("input", function () {

        this.value = this.value.replace(/\D/g, "");

        cityInput.value = "";
        stateInput.value = "";
        pinStatus.textContent = "";
        pinStatus.className = "pin-status";

        clearTimeout(pinTimer);

        if (this.value.length !== 6) {
            return;
        }

        pinTimer = setTimeout(() => {
            lookupPIN(this.value);
        }, 400);

    });


    async function lookupPIN(pin) {

        pinStatus.textContent = "Finding location...";
        pinStatus.className = "pin-status loading";

        try {

            const response = await fetch(
                `https://api.postalpincode.in/pincode/${pin}`
            );

            if (!response.ok) {
                throw new Error("Network error");
            }

            const data = await response.json();

            if (
                !data ||
                !data[0] ||
                data[0].Status !== "Success" ||
                !data[0].PostOffice ||
                data[0].PostOffice.length === 0
            ) {

                cityInput.value = "";
                stateInput.value = "";

                pinStatus.textContent =
                    "PIN code not found. Please check it.";

                pinStatus.className =
                    "pin-status error";

                return;
            }


            const location =
                data[0].PostOffice[0];


            /*
                Different PIN areas can contain
                multiple post offices.

                We use the first valid location
                returned by the postal service.
            */

            cityInput.value =
                location.District ||
                location.Block ||
                location.Name ||
                "";

            stateInput.value =
                location.State || "";


            pinStatus.textContent =
                "✓ Location found successfully";

            pinStatus.className =
                "pin-status success";


        } catch (error) {

            console.error(
                "PIN lookup error:",
                error
            );

            pinStatus.textContent =
                "Unable to find location. Please try again.";

            pinStatus.className =
                "pin-status error";
        }
    }


    /* =====================================================
       REGISTER ACCOUNT
    ===================================================== */

    document
        .getElementById("register-form")
        .addEventListener("submit", async function (event) {

            event.preventDefault();


            const name =
                document.getElementById("name").value.trim();

            const email =
                document.getElementById("email").value.trim().toLowerCase();

            const password =
                document.getElementById("password").value;

            const phoneNumber =
                document.getElementById("phone").value.trim();

            const address =
                document.getElementById("address").value.trim();

            const pincode =
                document.getElementById("pincode").value.trim();

            const city =
                document.getElementById("city").value.trim();

            const state =
                document.getElementById("state").value.trim();

            const country =
                document.getElementById("country").value;


            const message =
                document.getElementById("message");


            /* =========================
               BASIC VALIDATION
            ========================= */

            if (!name) {
                message.textContent =
                    "Please enter your full name.";
                message.style.color = "red";
                return;
            }


            if (!email) {
                message.textContent =
                    "Please enter your email.";
                message.style.color = "red";
                return;
            }


            if (password.length < 6) {
                message.textContent =
                    "Password must contain at least 6 characters.";
                message.style.color = "red";
                return;
            }


            if (
                phoneNumber.length < 6 ||
                phoneNumber.length > 15
            ) {
                message.textContent =
                    "Please enter a valid phone number.";
                message.style.color = "red";
                return;
            }


            if (!address) {
                message.textContent =
                    "Please enter your delivery address.";
                message.style.color = "red";
                return;
            }


            if (!/^\d{6}$/.test(pincode)) {
                message.textContent =
                    "Please enter a valid 6-digit PIN code.";
                message.style.color = "red";
                return;
            }


            if (!city || !state) {

                message.textContent =
                    "Please enter a valid PIN code so the location can be detected.";

                message.style.color = "red";

                return;
            }


            /* =========================
               GET EXISTING USERS
            ========================= */

            let users =
                JSON.parse(
                    localStorage.getItem("freshbite_users")
                ) || [];


            /* =========================
               CHECK DUPLICATE EMAIL
            ========================= */

            const existingUser =
                users.find(
                    user =>
                        user.email.toLowerCase() === email
                );


            if (existingUser) {

                message.textContent =
                    "An account with this email already exists.";

                message.style.color = "red";

                return;
            }


            /* =========================
               COMPLETE PHONE NUMBER
            ========================= */

            const fullPhone =
                selectedCountryCode + phoneNumber;


            /* =========================
               CREATE USER
            ========================= */

            const newUser = {

                id: Date.now(),

                name: name,

                email: email,

                password: password,

                phone: fullPhone,

                countryCode: selectedCountryCode,

                phoneNumber: phoneNumber,

                address: address,

                pincode: pincode,

                city: city,

                state: state,

                country: country,

                createdAt:
                    new Date().toISOString()
            };


            users.push(newUser);


            localStorage.setItem(
                "freshbite_users",
                JSON.stringify(users)
            );


            /* =========================
               LOGIN USER AUTOMATICALLY
            ========================= */

            localStorage.setItem(
                "freshbite_user",
                JSON.stringify(newUser)
            );

            localStorage.setItem(
                "freshbite_logged_in",
                "true"
            );


            message.textContent =
                "✓ Account created successfully!";

            message.style.color =
                "#16803c";


            /* =========================
               REDIRECT
            ========================= */

            setTimeout(function () {

                window.location.href =
                    "menu.html";

            }, 800);

        });
</script>

</body>
</html>
