<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login - FreshBite</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #fff8f3;
            color: #333;
        }

        /* =========================
           NAVBAR
        ========================= */

        .navbar {
            height: 65px;

            background: white;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 35px;

            box-shadow:
                0 2px 8px rgba(0,0,0,0.08);
        }

        .logo {
            text-decoration: none;

            color: #ff6b35;

            font-size: 26px;

            font-weight: bold;
        }

        .nav-links {
            display: flex;

            gap: 22px;
        }

        .nav-links a {
            text-decoration: none;

            color: #333;

            font-weight: bold;
        }

        .nav-links a:hover {
            color: #ff6b35;
        }

        /* =========================
           LOGIN PAGE
        ========================= */

        .login-page {

            min-height:
                calc(100vh - 65px);

            display: flex;

            justify-content: center;

            align-items: center;

            padding: 30px 20px;
        }

        .login-card {

            width: 430px;

            background: white;

            padding: 38px;

            border-radius: 15px;

            box-shadow:
                0 5px 25px rgba(0,0,0,0.10);
        }

        .login-card h1 {

            text-align: center;

            margin: 0 0 8px;

            color: #ff6b35;
        }

        .subtitle {

            text-align: center;

            color: #777;

            margin-bottom: 28px;
        }

        /* =========================
           FORM
        ========================= */

        .form-group {

            margin-bottom: 18px;
        }

        .form-group label {

            display: block;

            font-weight: bold;

            font-size: 14px;

            margin-bottom: 7px;
        }

        .form-group input {

            width: 100%;

            padding: 13px;

            border:
                1px solid #ddd;

            border-radius: 7px;

            font-size: 14px;

            outline: none;
        }

        .form-group input:focus {

            border-color:
                #ff6b35;
        }

        .login-btn {

            width: 100%;

            padding: 13px;

            border: none;

            border-radius: 7px;

            background: #ff6b35;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;
        }

        .login-btn:hover {

            background: #e85a27;
        }

        #login-message {

            text-align: center;

            margin-top: 15px;

            min-height: 20px;

            font-size: 14px;

            font-weight: bold;
        }

        /* =========================
           REGISTER
        ========================= */

        .register-link {

            text-align: center;

            margin-top: 22px;

            font-size: 14px;
        }

        .register-link a {

            color: #ff6b35;

            font-weight: bold;

            text-decoration: none;
        }

        /* =========================
           ADMIN INFO
        ========================= */

        .admin-info {

            margin-top: 25px;

            padding: 14px;

            background: #fff4ed;

            border-radius: 8px;

            text-align: center;

            font-size: 13px;

            color: #666;
        }

        .admin-info strong {

            color: #333;
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 600px) {

            .navbar {
                padding: 0 15px;
            }

            .nav-links {
                gap: 10px;
            }

            .login-card {
                width: 100%;
                padding: 28px 22px;
            }
        }

    </style>

</head>


<body>


<!-- =========================
     NAVBAR
========================= -->

<nav class="navbar">

    <a
        href="index.html"
        class="logo"
    >
        FreshBite
    </a>

    <div class="nav-links">

        <a href="index.html">
            Home
        </a>

        <a href="register.html">
            Register
        </a>

    </div>

</nav>


<!-- =========================
     LOGIN
========================= -->

<main class="login-page">

    <div class="login-card">

        <h1>
            Welcome Back 👋
        </h1>

        <p class="subtitle">
            Login to your FreshBite account
        </p>


        <form id="login-form">


            <div class="form-group">

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    required
                >

            </div>


            <button
                type="submit"
                class="login-btn"
            >
                Login
            </button>


        </form>


        <div id="login-message"></div>


        <div class="register-link">

            Don't have an account?

            <a href="register.html">
                Register
            </a>

        </div>


        <div class="admin-info">

            <strong>Admin Login</strong>

            <br><br>

            Email:
            admin@freshbite.com

            <br>

            Password:
            admin123

        </div>

    </div>

</main>


<script>

/* =====================================================
   ADMIN CREDENTIALS
===================================================== */

const ADMIN_EMAIL =
    "admin@freshbite.com";

const ADMIN_PASSWORD =
    "admin123";


/* =====================================================
   LOGIN
===================================================== */

document
    .getElementById("login-form")
    .addEventListener(
        "submit",
        function(event) {

            event.preventDefault();


            const email =
                document
                    .getElementById("email")
                    .value
                    .trim()
                    .toLowerCase();


            const password =
                document
                    .getElementById("password")
                    .value;


            const message =
                document.getElementById(
                    "login-message"
                );


            /* =================================================
               ADMIN LOGIN
            ================================================= */

            if (
                email === ADMIN_EMAIL &&
                password === ADMIN_PASSWORD
            ) {


                /*
                 * Remove customer session
                 */

                localStorage.removeItem(
                    "freshbite_user"
                );

                localStorage.removeItem(
                    "freshbite_logged_in"
                );


                /*
                 * Create separate admin session
                 */

                const admin = {

                    id: "admin-001",

                    name: "FreshBite Administrator",

                    email:
                        ADMIN_EMAIL,

                    role: "admin"

                };


                localStorage.setItem(
                    "freshbite_admin",
                    JSON.stringify(admin)
                );


                localStorage.setItem(
                    "freshbite_admin_logged_in",
                    "true"
                );


                message.style.color =
                    "#16a34a";

                message.textContent =
                    "Admin login successful!";


                /*
                 * DIRECTLY OPEN ADMIN PAGE
                 */

                setTimeout(
                    function() {

                        window.location.href =
                            "admin-dashboard.html";

                    },
                    300
                );


                return;
            }


            /* =================================================
               CUSTOMER LOGIN
            ================================================= */

            const users =
                JSON.parse(
                    localStorage.getItem(
                        "freshbite_users"
                    ) || "[]"
                );


            const user =
                users.find(
                    function(u) {

                        return (
                            String(u.email)
                                .toLowerCase() ===
                            email
                            &&
                            String(u.password) ===
                            password
                        );

                    }
                );


            if (!user) {

                message.style.color =
                    "#dc2626";

                message.textContent =
                    "Invalid email or password.";

                return;
            }


            /*
             * Make sure customer is NOT admin
             */

            localStorage.removeItem(
                "freshbite_admin"
            );

            localStorage.removeItem(
                "freshbite_admin_logged_in"
            );


            const customer = {

                ...user,

                role: "customer"

            };


            localStorage.setItem(
                "freshbite_user",
                JSON.stringify(customer)
            );


            localStorage.setItem(
                "freshbite_logged_in",
                "true"
            );


            message.style.color =
                "#16a34a";

            message.textContent =
                "Login successful!";


            setTimeout(
                function() {

                    window.location.href =
                        "menu.html";

                },
                300
            );

        }
    );

</script>


</body>

</html>
