<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>FreshBite - Order Success</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {

            margin: 0;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #fff3e0,
                    #ffe0b2
                );

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

        }

        .success-card {

            background: white;

            width: 90%;

            max-width: 600px;

            padding: 50px;

            border-radius: 20px;

            text-align: center;

            box-shadow:
                0 10px 30px
                rgba(0,0,0,0.12);

        }

        .success-icon {

            font-size: 80px;

            margin-bottom: 20px;

        }

        h1 {

            color: #198754;

            margin-bottom: 10px;

        }

        .order-id {

            font-size: 20px;

            font-weight: bold;

            color: #ff5722;

            margin: 20px 0;

        }

        .buttons {

            display: flex;

            gap: 15px;

            justify-content: center;

            margin-top: 30px;

            flex-wrap: wrap;

        }

        .btn {

            display: inline-block;

            padding: 13px 25px;

            border-radius: 8px;

            text-decoration: none;

            font-weight: bold;

        }

        .menu-btn {

            background: #ff5722;

            color: white;

        }

        .orders-btn {

            background: #198754;

            color: white;

        }

    </style>

</head>

<body>

    <div class="success-card">

        <div class="success-icon">
            🎉
        </div>

        <h1>
            Order Placed Successfully!
        </h1>

        <p>
            Thank you for ordering from FreshBite.
        </p>

        <div
            id="order-id"
            class="order-id"
        >
            Order #--
        </div>

        <p>
            Your food is being prepared.
        </p>

        <div class="buttons">

            <a
                href="menu.html"
                class="btn menu-btn"
            >
                🍕 Order More
            </a>

            <a
                href="admin-dashboard.html"
                class="btn orders-btn"
            >
                📦 View Orders
            </a>

        </div>

    </div>

    <script>

        const params =
            new URLSearchParams(
                window.location.search
            );

        const orderId =
            params.get("orderId");

        const orderElement =
            document.getElementById(
                "order-id"
            );

        if (orderElement && orderId) {

            orderElement.textContent =
                `Order #${orderId}`;

        }

    </script>

</body>

</html>
